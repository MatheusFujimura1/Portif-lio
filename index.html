<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Comandas – Pizzaria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />

  <!-- Firebase (compat para facilitar) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Painel de Comandas</h1>
      <p class="subtitle">Pizzaria – Cozinha / Balcão</p>
    </div>
    <div class="status-dot" id="connectionDot" title="Status da conexão"></div>
  </header>

  <section class="filters">
    <button class="chip chip-active" data-status="todos">Todos</button>
    <button class="chip" data-status="novo">Novos</button>
    <button class="chip" data-status="preparo">Em preparo</button>
    <button class="chip" data-status="entrega">Saiu p/ entrega</button>
    <button class="chip" data-status="finalizado">Finalizados</button>
  </section>

  <main id="listaPedidos" class="lista-pedidos">
    <!-- Pedidos vão aparecer aqui via JS -->
  </main>

  <template id="pedidoTemplate">
    <article class="pedido-card">
      <header class="pedido-header">
        <div>
          <h2 class="pedido-id"></h2>
          <p class="pedido-cliente"></p>
        </div>
        <span class="badge-status"></span>
      </header>

      <p class="pedido-endereco"></p>

      <div class="pedido-itens"></div>

      <div class="pedido-meta">
        <span class="pedido-pagamento"></span>
        <span class="pedido-hora"></span>
      </div>

      <div class="pedido-acoes">
        <button class="btn-status" data-next="novo">Novo</button>
        <button class="btn-status" data-next="preparo">Em preparo</button>
        <button class="btn-status" data-next="entrega">Saiu p/ entrega</button>
        <button class="btn-status" data-next="finalizado">Finalizado</button>
      </div>
    </article>
  </template>

  <div id="toast" class="toast">Status atualizado</div>

  <script src="main.js"></script>
</body>
</html>
